name: Daily original Short
on:
  schedule:
    - cron: '45 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview never uploads; publish requires both upload opt-ins'
        type: choice
        options: [preview, publish, recover]
        default: preview
      recover_job:
        description: 'recover only: wonder-YYYY-MM-DD from the failed job summary'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: youtube-daily-publication
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Only this serialized job can update the shorts-state journal.
    env:
      UPLOAD_ENABLED: ${{ vars.UPLOAD_ENABLED || 'false' }}
      GH_STATE_TOKEN: ${{ github.token }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install free media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/cache@v4
        with:
          path: .cache/voice
          key: piper-ljspeech-${{ runner.os }}-${{ hashFiles('voice.lock.json') }}
      - name: Tests
        run: python -m pytest -q
      - name: Run daily pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          RECOVER_JOB: ${{ inputs.recover_job }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${INPUT_MODE:-preview}"
          if [ "$EVENT_NAME" = schedule ]; then
            mode=preview
            if [ "$UPLOAD_ENABLED" = true ]; then mode=publish; fi
          fi
          args=("$mode")
          if [ "$mode" = recover ]; then args+=(--recover-job "$RECOVER_JOB"); fi
          python -m shorts.cli "${args[@]}"
      - name: Save short-lived review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-${{ github.run_id }}
          path: |
            output/preview.mp4
            output/script.json
            output/script.txt
            output/captions.srt
            output/timeline.json
            output/caption-layout.json
            output/validation.json
            output/result.json
            output/scene-*.png
            output/final-frame.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Failure instructions
        if: failure()
        run: |
          echo 'Publication stopped. Read the failed stage above. For ambiguous uploads, use docs/RECOVERY.md; do not start a replacement upload.' >> "$GITHUB_STEP_SUMMARY"
